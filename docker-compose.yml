services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DRY_RUN: ${DRY_RUN:-true}
      WORKER_TIMEOUT_SECONDS: ${WORKER_TIMEOUT_SECONDS:-7200}
    networks: [control]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${XBOW_PORT:-8080}:80"
    networks: [control]

networks:
  control:
    driver: bridge
