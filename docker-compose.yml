services:
  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    environment:
      DRY_RUN: ${DRY_RUN:-true}
      XBOW_API_TOKEN: ${XBOW_API_TOKEN:-}
      XBOW_DB_PATH: /data/xbow.sqlite3
      XBOW_ARTIFACT_ROOT: /data/artifacts
    volumes:
      - xbow-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-m", "app.readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [control]

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker_service"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DRY_RUN: ${DRY_RUN:-true}
      XBOW_ENABLE_ACTIVE_SCANS: ${XBOW_ENABLE_ACTIVE_SCANS:-false}
      XBOW_ENABLE_HTTP_VALIDATION: ${XBOW_ENABLE_HTTP_VALIDATION:-false}
      XBOW_ENABLE_BROWSER_AUTOMATION: ${XBOW_ENABLE_BROWSER_AUTOMATION:-false}
      WORKER_TIMEOUT_SECONDS: ${WORKER_TIMEOUT_SECONDS:-7200}
      XBOW_JOB_LEASE_SECONDS: ${XBOW_JOB_LEASE_SECONDS:-21600}
      XBOW_MAX_STRIX_JSON_BYTES: ${XBOW_MAX_STRIX_JSON_BYTES:-5242880}
      XBOW_DB_PATH: /data/xbow.sqlite3
      XBOW_ARTIFACT_ROOT: /data/artifacts
      XBOW_STRIX_RUN_ROOT: /data/strix_runs
      XBOW_WORKER_POLL_SECONDS: ${XBOW_WORKER_POLL_SECONDS:-1}
      STRIX_LLM: ${STRIX_LLM:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
    volumes:
      - xbow-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    healthcheck:
      test: ["CMD", "python", "-m", "app.readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [control]

  frontend:
    build: ./frontend
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${XBOW_PORT:-8080}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    networks: [control]

volumes:
  xbow-data:

networks:
  control:
    driver: bridge
