server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /index.html {
    add_header Cache-Control "no-store, max-age=0" always;
  }

  location = /simple.js {
    add_header Cache-Control "no-store, max-age=0" always;
  }

  location = /sw.js {
    add_header Cache-Control "no-store, max-age=0" always;
  }

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://backend:8000/health;
    add_header Cache-Control "no-store" always;
  }

  location /live {
    proxy_pass http://backend:8000/live;
    add_header Cache-Control "no-store" always;
  }

  location /ready {
    proxy_pass http://backend:8000/ready;
    add_header Cache-Control "no-store" always;
  }

  location /auth-status {
    proxy_pass http://backend:8000/auth-status;
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
