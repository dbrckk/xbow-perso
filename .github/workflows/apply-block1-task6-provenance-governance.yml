name: Apply Block1 Task6 Provenance Governance

on:
  push:
    branches:
      - governance/pr151-selective-migration
    paths:
      - .github/workflows/apply-block1-task6-provenance-governance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/pr151-selective-migration
          fetch-depth: 0

      - name: Apply strict provenance governance patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path_name, replacements):
              path = Path(path_name)
              text = path.read_text()
              for old, new, label in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise RuntimeError(f"{path_name}: {label}: expected one match, found {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text)

          patch(
              "backend/app/deployment_preflight.py",
              [
                  (
                      '''def _configured(name: str) -> bool:\n    return bool((os.getenv(name) or "").strip())\n\n\ndef _production_mode() -> bool:\n''',
                      '''def _configured(name: str) -> bool:\n    return bool((os.getenv(name) or "").strip())\n\n\ndef _bool_env(name: str, default: bool = False) -> tuple[bool, bool]:\n    raw = os.getenv(name)\n    if raw is None:\n        return default, True\n    value = raw.strip().lower()\n    if value in {"1", "true", "yes", "on"}:\n        return True, True\n    if value in {"0", "false", "no", "off"}:\n        return False, True\n    return default, False\n\n\ndef _production_mode() -> bool:\n''',
                      "strict bool helper",
                  ),
                  (
                      '''    issues: list[dict[str, Any]] = []\n    production = _production_mode()\n\n    if production:\n''',
                      '''    issues: list[dict[str, Any]] = []\n    production = _production_mode()\n    legacy_jobs_enabled, legacy_jobs_valid = _bool_env(\n        "XBOW_ALLOW_LEGACY_UNPROVENANCED_JOBS"\n    )\n\n    if not legacy_jobs_valid:\n        issues.append(\n            {\n                "code": "invalid_legacy_provenance_flag",\n                "severity": "error",\n                "component": "job_provenance",\n            }\n        )\n    elif legacy_jobs_enabled:\n        issues.append(\n            {\n                "code": "legacy_unprovenanced_jobs_enabled",\n                "severity": "warning",\n                "component": "job_provenance",\n            }\n        )\n\n    if production:\n''',
                      "legacy provenance diagnostics",
                  ),
                  (
                      '''        "pentagi": {\n            "mode": pentagi.get("mode"),\n            "dispatch_ready": bool(pentagi.get("dispatch_ready")),\n            "execution_transport_enforceable": bool(\n                pentagi.get("execution_transport_enforceable")\n            ),\n            "base_url_configured": _configured("XBOW_PENTAGI_BASE_URL"),\n            "model_provider_configured": _configured(\n                "XBOW_PENTAGI_MODEL_PROVIDER"\n            ),\n        },\n        "read_only": True,\n''',
                      '''        "pentagi": {\n            "mode": pentagi.get("mode"),\n            "dispatch_ready": bool(pentagi.get("dispatch_ready")),\n            "execution_transport_enforceable": bool(\n                pentagi.get("execution_transport_enforceable")\n            ),\n            "base_url_configured": _configured("XBOW_PENTAGI_BASE_URL"),\n            "model_provider_configured": _configured(\n                "XBOW_PENTAGI_MODEL_PROVIDER"\n            ),\n        },\n        "job_provenance": {\n            "strict_by_default": True,\n            "legacy_unprovenanced_jobs_enabled": legacy_jobs_enabled,\n            "configuration_valid": legacy_jobs_valid,\n            "schema": "job-provenance-v1",\n        },\n        "read_only": True,\n''',
                      "preflight provenance object",
                  ),
              ],
          )

          patch(
              "backend/app/main.py",
              [
                  (
                      '''from .job_provenance import attach_job_provenance\n''',
                      '''from .job_provenance import attach_job_provenance, verify_job_provenance\n''',
                      "provenance verifier import",
                  ),
                  (
                      '''            "crash_safe_outbox": True,\n            "outbox_observability": True,\n''',
                      '''            "crash_safe_outbox": True,\n            "outbox_observability": True,\n            "policy_bound_job_provenance": True,\n''',
                      "capability flag",
                  ),
                  (
                      '''@app.get("/api/jobs/{job_id}")\ndef get_job(job_id: str):\n    job = queue().get(job_id)\n    if not job:\n        raise HTTPException(status_code=404, detail="Job not found")\n    return job\n\n\ndef _validation_request_id(finding_id: str) -> str:\n''',
                      '''@app.get("/api/jobs/{job_id}")\ndef get_job(job_id: str):\n    job = queue().get(job_id)\n    if not job:\n        raise HTTPException(status_code=404, detail="Job not found")\n    return job\n\n\n@app.get("/api/jobs/{job_id}/provenance")\ndef get_job_provenance_status(job_id: str):\n    job = queue().get(job_id)\n    if not job:\n        raise HTTPException(status_code=404, detail="Job not found")\n    campaign = assert_campaign_exists(str(job["campaign_id"]))\n    verification = verify_job_provenance(job, campaign)\n    return {\n        "job_id": job["id"],\n        "campaign_id": campaign.id,\n        "job_kind": job["kind"],\n        "provenance": verification,\n        "read_only": True,\n        "payload_exposed": False,\n        "fail_closed_capable": True,\n    }\n\n\ndef _validation_request_id(finding_id: str) -> str:\n''',
                      "redacted provenance route",
                  ),
              ],
          )
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Verify focused Task 6 contracts
        run: |
          python -m compileall -q backend/app backend/tests
          ruff check backend/app backend/tests
          PYTHONPATH=backend pytest -q \
            backend/tests/test_deployment_preflight.py \
            backend/tests/test_job_provenance.py \
            backend/tests/test_validation_state.py \
            backend/tests/test_finding_consensus.py \
            backend/tests/test_report_readiness.py

      - name: Commit strict provenance governance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/deployment_preflight.py backend/app/main.py
          git commit -m "feat: expose strict provenance governance"
          git push origin HEAD:governance/pr151-selective-migration
