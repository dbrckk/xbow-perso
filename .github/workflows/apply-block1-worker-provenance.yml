name: Apply Block1 Worker Provenance

on:
  push:
    branches:
      - governance/pr151-selective-migration
    paths:
      - .github/workflows/apply-block1-worker-provenance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/pr151-selective-migration
          fetch-depth: 0

      - name: Apply deterministic worker provenance admission patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/worker_service.py")
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "from .jobqueue import JobQueue\n",
              "from .job_provenance import (\n    JobProvenanceError,\n    provenance_required_for_job_kind,\n    require_job_provenance,\n)\nfrom .jobqueue import JobQueue\n",
              "job provenance imports",
          )
          replace_once(
              '''def _active_scanner_execution_requested() -> bool:\n    return (\n        _worker_bool("XBOW_ENABLE_ACTIVE_SCANS", False)\n        and not _worker_bool("DRY_RUN", True)\n    )\n\n\ndef _claim_for_role''',
              '''def _legacy_unprovenanced_jobs_allowed() -> bool:\n    return _worker_bool("XBOW_ALLOW_LEGACY_UNPROVENANCED_JOBS", False)\n\n\ndef _verify_policy_bound_job(job: dict, store: Storage) -> None:\n    payload = job.get("payload") if isinstance(job.get("payload"), dict) else {}\n    has_provenance = "_provenance" in payload\n    required = provenance_required_for_job_kind(str(job.get("kind") or ""))\n\n    if required and not has_provenance:\n        if _legacy_unprovenanced_jobs_allowed():\n            return\n        raise WorkerPolicyError("job provenance rejected: provenance_missing")\n\n    if not has_provenance:\n        return\n\n    campaign, _version = _campaign(store, job["campaign_id"])\n    try:\n        require_job_provenance(job, campaign)\n    except JobProvenanceError as exc:\n        raise WorkerPolicyError(str(exc)) from exc\n\n\ndef _active_scanner_execution_requested() -> bool:\n    return (\n        _worker_bool("XBOW_ENABLE_ACTIVE_SCANS", False)\n        and not _worker_bool("DRY_RUN", True)\n    )\n\n\ndef _claim_for_role''',
              "worker admission helpers",
          )
          replace_once(
              '''    try:\n        with _lease_heartbeat(queue, job["id"], worker_id):\n''',
              '''    try:\n        _verify_policy_bound_job(job, store)\n        with _lease_heartbeat(queue, job["id"], worker_id):\n''',
              "process admission",
          )
          path.write_text(text)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Verify focused worker provenance regressions
        run: |
          python -m py_compile backend/app/worker_service.py
          ruff check backend/app/worker_service.py backend/tests/test_worker_job_provenance.py
          PYTHONPATH=backend pytest -q backend/tests/test_worker_job_provenance.py

      - name: Commit worker admission gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/worker_service.py
          git commit -m "feat: enforce worker job provenance fail closed"
          git push origin HEAD:governance/pr151-selective-migration
