name: Apply Block1 API Provenance

on:
  push:
    branches:
      - governance/pr151-selective-migration
    paths:
      - .github/workflows/apply-block1-api-provenance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/pr151-selective-migration
          fetch-depth: 0

      - name: Apply deterministic API provenance patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/main.py")
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "from .validation_state import has_observed_independent_validation\n",
              "from .validation_state import has_evidence_backed_independent_validation\n",
              "validation import",
          )
          replace_once(
              '''def _has_observed_independent_validation(campaign_id: str, finding: Finding) -> bool:\n    graph = _campaign_graph(campaign_id)\n    return has_observed_independent_validation(graph, f"finding:{finding.id}")\n''',
              '''def _has_evidence_backed_independent_validation(campaign_id: str, finding: Finding) -> bool:\n    graph = _campaign_graph(campaign_id)\n    return has_evidence_backed_independent_validation(graph, f"finding:{finding.id}")\n''',
              "validation helper",
          )
          replace_once(
              '''    validation_job = queue().enqueue(\n        campaign.id,\n        "independent_validation",\n        {"campaign_id": campaign.id, "finding_id": finding.id, "asset": current.asset},\n        max_attempts=2,\n        dedupe_key=request_id,\n    )\n''',
              '''    validation_job = queue().enqueue(\n        campaign.id,\n        "independent_validation",\n        attach_job_provenance(\n            {\n                "campaign_id": campaign.id,\n                "finding_id": finding.id,\n                "asset": current.asset,\n            },\n            latest,\n            job_kind="independent_validation",\n            action="validate",\n        ),\n        max_attempts=2,\n        dedupe_key=request_id,\n    )\n''',
              "validation enqueue",
          )
          replace_once(
              '''    report_job = queue().enqueue(\n        campaign.id,\n        "report",\n        {"campaign_id": campaign.id, "platform": platform},\n        max_attempts=2,\n        dedupe_key=request_id,\n    )\n''',
              '''    report_job = queue().enqueue(\n        campaign.id,\n        "report",\n        attach_job_provenance(\n            {"campaign_id": campaign.id, "platform": platform},\n            latest,\n            job_kind="report",\n            action="report",\n        ),\n        max_attempts=2,\n        dedupe_key=request_id,\n    )\n''',
              "completion report enqueue",
          )
          replace_once(
              '''    if not _has_observed_independent_validation(campaign_id, finding):\n        raise HTTPException(status_code=409, detail="Finding requires observed independent validation evidence before resolution")\n''',
              '''    if not _has_evidence_backed_independent_validation(campaign_id, finding):\n        raise HTTPException(\n            status_code=409,\n            detail=(\n                "Finding requires evidence-backed independent validation "\n                "before resolution"\n            ),\n        )\n''',
              "resolution gate",
          )
          replace_once(
              '''    job = queue().enqueue(\n        campaign.id,\n        "report",\n        {"campaign_id": campaign.id, "platform": platform},\n        max_attempts=2,\n        dedupe_key=f"report:{platform}:{request_id}",\n    )\n''',
              '''    job = queue().enqueue(\n        campaign.id,\n        "report",\n        attach_job_provenance(\n            {"campaign_id": campaign.id, "platform": platform},\n            latest,\n            job_kind="report",\n            action="report",\n        ),\n        max_attempts=2,\n        dedupe_key=f"report:{platform}:{request_id}",\n    )\n''',
              "manual report enqueue",
          )
          path.write_text(text)

          path = Path("backend/tests/test_api_idempotency.py")
          text = path.read_text()

          def test_replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              text = text.replace(old, new, 1)

          test_replace_once(
              '''    store.put_observation(\n        "c1",\n        Observation(\n            "v1",\n            "validation",\n            "observed",\n            "independent-http-validator",\n            parent_ids=(f"finding:{finding_id}",),\n        ).to_dict(),\n    )\n''',
              '''    store.put_observation(\n        "c1",\n        Observation(\n            "v1",\n            "validation",\n            "observed",\n            "independent-http-validator",\n            parent_ids=(f"finding:{finding_id}",),\n        ).to_dict(),\n    )\n    store.put_observation(\n        "c1",\n        Observation(\n            "validation-evidence:v1",\n            "evidence",\n            "validation-artifact",\n            "independent-http-validator",\n            parent_ids=("v1",),\n        ).to_dict(),\n    )\n''',
              "evidence-backed validation fixture",
          )
          test_replace_once(
              '''    existing = jobs.enqueue(\n        campaign.id,\n        "report",\n        {"campaign_id": campaign.id, "platform": "generic"},\n        max_attempts=2,\n        dedupe_key=f"report:generic:{request_id}",\n    )\n''',
              '''    existing = jobs.enqueue(\n        campaign.id,\n        "report",\n        main.attach_job_provenance(\n            {"campaign_id": campaign.id, "platform": "generic"},\n            campaign,\n            job_kind="report",\n            action="report",\n        ),\n        max_attempts=2,\n        dedupe_key=f"report:generic:{request_id}",\n    )\n''',
              "provenanced report retry fixture",
          )
          path.write_text(text)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Verify focused API provenance regressions
        run: |
          python -m py_compile backend/app/main.py
          ruff check backend/app/main.py backend/tests/test_job_provenance_api_integration.py backend/tests/test_api_idempotency.py
          PYTHONPATH=backend pytest -q \
            backend/tests/test_job_provenance_api_integration.py \
            backend/tests/test_job_provenance_integration.py \
            backend/tests/test_api_idempotency.py

      - name: Commit production and fixture changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py backend/tests/test_api_idempotency.py
          git commit -m "feat: bind direct api jobs to policy provenance"
          git push origin HEAD:governance/pr151-selective-migration
