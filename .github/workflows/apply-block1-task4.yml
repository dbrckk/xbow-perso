name: Apply Block1 Task4

on:
  push:
    branches:
      - governance/pr151-selective-migration
    paths:
      - tools/apply_block1_task4.py
      - .github/workflows/apply-block1-task4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: governance/pr151-selective-migration
          fetch-depth: 0

      - name: Apply deterministic Task 4 patch
        run: python tools/apply_block1_task4.py

      - name: Verify touched Python files compile
        run: python -m py_compile backend/app/main.py backend/app/orchestrator.py backend/app/observation_graph.py

      - name: Commit applied production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py backend/app/orchestrator.py
          if git diff --cached --quiet; then
            echo "No production changes to commit"
            exit 0
          fi
          git commit -m "feat: attach provenance to governed job producers"
          git push origin HEAD:governance/pr151-selective-migration
