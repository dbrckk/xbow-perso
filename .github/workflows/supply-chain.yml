name: supply-chain

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: pip install cyclonedx-bom==7.1.0
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format JSON --output-file backend-sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: backend-sbom
          path: backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The public GHCR mirror is pinned to the index digest observed in
      # its manifest; never allow a silently updated BuildKit tag.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=ghcr.io/dockerhub-mirror/moby__buildkit:buildx-stable-1@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - name: Build backend without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: false
          provenance: mode=max
          sbom: true
          tags: xbow-perso-backend:ci
      - name: Build frontend without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: false
          provenance: mode=max
          sbom: true
          tags: xbow-perso-frontend:ci
