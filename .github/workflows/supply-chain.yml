name: supply-chain

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: pip install cyclonedx-bom==7.1.0
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format JSON --output-file backend-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: false
          provenance: mode=max
          sbom: true
          tags: xbow-perso-backend:ci
      - name: Build frontend without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: false
          provenance: mode=max
          sbom: true
          tags: xbow-perso-frontend:ci
