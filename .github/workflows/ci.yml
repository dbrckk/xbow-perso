name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: xbow
          POSTGRES_USER: xbow
          POSTGRES_PASSWORD: xbow-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xbow -d xbow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q backend/app backend/tests
      - run: ruff check backend/app backend/tests
      - run: |
          PYTHONPATH=backend \
          XBOW_REDIS_URL=redis://localhost:6379/15 \
          XBOW_TEST_POSTGRES_URL=postgresql://xbow:xbow-ci@localhost:5432/xbow \
          pytest -q --strict-config --strict-markers backend/tests
      - run: |
          PYTHONPATH=backend \
          XBOW_DB_PATH=/tmp/xbow-ci.sqlite3 \
          XBOW_ARTIFACT_ROOT=/tmp/xbow-ci-artifacts \
          python -m app.readiness
      - run: pip-audit -r backend/requirements.txt

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build --pull
