name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Hosted Ubuntu includes PostgreSQL 16, but public ECR's anonymous
      # Redis image downloads can exceed its data quota before steps start.
      # Use signed Ubuntu packages and the local PostgreSQL service instead.
      - name: Start Redis and PostgreSQL without container registries
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v redis-server >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends redis-server redis-tools
          fi
          sudo systemctl start redis-server.service
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE xbow LOGIN PASSWORD 'xbow-ci'"
          sudo -u postgres createdb -O xbow xbow
          redis-cli -h 127.0.0.1 -p 6379 ping | grep -qx PONG
          PGPASSWORD=xbow-ci psql \
            -h 127.0.0.1 -p 5432 -U xbow -d xbow \
            -v ON_ERROR_STOP=1 -tAc "SELECT 1" | grep -qx 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q backend/app backend/tests
      - name: Verify Strix manifest is safe to materialize later
        shell: bash
        run: |
          PYTHONPATH=backend python - <<'PY'
          from types import SimpleNamespace
          from app.strix_manifest_admission import (
              StrixManifestAdmissionError,
              build_strix_manifest_admission_plan,
          )

          def file(data=b"safe"):
              return SimpleNamespace(type="file", content=data)

          def check(entries, environment=None):
              manifest = SimpleNamespace(
                  version=1,
                  root="/workspace",
                  entries=entries,
                  environment=SimpleNamespace(value=environment or {}),
                  users=[],
                  groups=[],
                  extra_path_grants=[],
              )
              return build_strix_manifest_admission_plan(manifest)

          for entries, environment in (
              ({"config": file(), "config/child": file()}, {}),
              ({"repo/a": file(), "repo": file()}, {}),
              ({}, {"CONFIG": "safe\x00unsafe"}),
              ({"large": file(bytearray(1024 * 1024 + 1))}, {}),
              ({"invalid": file()}, {"CONFIG": "\ud800"}),
          ):
              try:
                  check(entries, environment)
              except StrixManifestAdmissionError:
                  continue
              raise AssertionError("unsafe Strix manifest was admitted")

          valid = check(
              {"a/config": file(), "a/other": file(), "b/config": file()},
              {"VALID": "yes"},
          )
          assert valid.entry_count == 3
          assert valid.manifest_materialized is False
          assert valid.upload_enabled is False
          print("Strix manifest overlap, encoding, NUL and size limits verified")
          PY
      - run: ruff check backend/app backend/tests
      - name: Verify pinned Strix backend hook
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          wheel="$tmp/strix_agent-1.6.2-py3-none-manylinux_2_17_x86_64.whl"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/usestrix/strix/releases/download/v1.6.2/strix_agent-1.6.2-py3-none-manylinux_2_17_x86_64.whl" \
            -o "$wheel"
          printf '%s  %s\n' \
            "1a93fbf0f18fad6bf4802c41fa5e032ce50880a655fddee47f6bec4f1ea2155b" \
            "$wheel" | sha256sum -c -
          python -m pip install --no-deps --target "$tmp/site" "$wheel"
          PYTHONPATH="$PWD/backend:$tmp/site" \
            python -m app.strix_backend_hook --self-test
          PYTHONPATH="$PWD/backend:$tmp/site" \
            python -m app.strix_python_compat_probe --self-test
          PYTHONPATH="$PWD/backend:$tmp/site" \
            python -m app.strix_python_bootstrap_runtime --self-test
          source_base="https://raw.githubusercontent.com/usestrix/strix/ff5c8cc8e46d8e60c2bc2439f7bcb07c05ca3db2"
          pyproject="$tmp/pyproject.toml"
          lockfile="$tmp/uv.lock"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$source_base/pyproject.toml" -o "$pyproject"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$source_base/uv.lock" -o "$lockfile"
          PYTHONPATH="$PWD/backend" \
            python -m app.strix_python_lock_probe \
              --self-test \
              --pyproject "$pyproject" \
              --lock "$lockfile"
          uv_archive="$tmp/uv-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/astral-sh/uv/releases/download/0.12.10/uv-x86_64-unknown-linux-gnu.tar.gz" \
            -o "$uv_archive"
          printf '%s  %s\n' \
            "173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b" \
            "$uv_archive" | sha256sum -c -
          PYTHONPATH="$PWD/backend" \
            python -m app.strix_python_toolchain_probe \
              --self-test \
              --manifest "$PWD/backend/strix-python-runtime.lock.json" \
              --uv-archive "$uv_archive" \
              --architecture amd64
      - run: |
          PYTHONPATH=backend \
          XBOW_REDIS_URL=redis://localhost:6379/15 \
          XBOW_TEST_POSTGRES_URL=postgresql://xbow:xbow-ci@localhost:5432/xbow \
          pytest -q --strict-config --strict-markers backend/tests
      - run: |
          PYTHONPATH=backend \
          XBOW_DB_PATH=/tmp/xbow-ci.sqlite3 \
          XBOW_ARTIFACT_ROOT=/tmp/xbow-ci-artifacts \
          python -m app.readiness
      - run: pip-audit -r backend/requirements.txt

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --check frontend/simple.js
      - run: node --check frontend/sw.js
      - run: bash -n scripts/mobile-production-preflight.sh
      - run: bash -n scripts/mobile-production-cutover.sh
      - run: bash -n scripts/mobile-production-rollback.sh
      - run: bash -n scripts/mobile-production-update.sh
      - run: bash -n scripts/mobile-production-status.sh
      - run: bash -n scripts/mobile-enable-hackerone-nuclei.sh
      - run: bash -n scripts/mobile-disable-hackerone-nuclei.sh
      - run: bash -n scripts/mobile-vault-cutover.sh
      - run: bash -n scripts/mobile-vault-rollback.sh
      - run: docker compose config --quiet
      - run: |
          XBOW_POSTGRES_PASSWORD=ci-postgres \
          XBOW_DATABASE_URL=postgresql://xbow:ci-postgres@postgres:5432/xbow \
          XBOW_REDIS_PASSWORD=ci-redis \
          XBOW_REDIS_URL=redis://:ci-redis@redis:6379/0 \
          docker compose -f docker-compose.yml -f docker-compose.distributed.yml config --quiet
      - run: |
          XBOW_PUBLIC_HOST=example.test \
          docker compose -f docker-compose.yml -f docker-compose.tls.yml config --quiet
      - name: Validate Caddy configuration with bounded registry retries
        shell: bash
        run: |
          set -euo pipefail
          caddy_image=mirror.gcr.io/library/caddy:2.11.4-alpine
          for attempt in 1 2 3 4; do
            if docker pull "$caddy_image"; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Caddy image unavailable after bounded retries" >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          docker run --rm --pull never \
            -e XBOW_PUBLIC_HOST=example.test \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$caddy_image" \
            caddy validate --config /etc/caddy/Caddyfile
      - run: docker compose build --pull
      - name: Smoke-test hardened frontend
        shell: bash
        run: |
          set -euo pipefail
          export XBOW_API_TOKEN="$(printf 'ci-smoke-%s' "$GITHUB_RUN_ID" | sha256sum | cut -d' ' -f1)"
          docker compose up -d backend frontend
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            docker compose ps
            docker compose logs --no-color backend frontend
            exit 1
          fi
          docker compose ps
          curl -fsSI http://127.0.0.1:8080/
          curl -fsSI http://127.0.0.1:8080/app.css
          curl -fsSI http://127.0.0.1:8080/simple.js
          html="$(curl -fsS http://127.0.0.1:8080/)"
          grep -q 'class="app-shell simple-shell"' <<< "$html"
          docker compose down -v
      - run: docker compose --profile scanner build --pull scanner-worker
      - run: docker compose --profile strix-broker build --pull strix-broker strix-egress
      - run: docker compose --profile strix-runner build --pull strix-runner
      - name: strix-runner-network-proof
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker compose --profile strix-broker --profile strix-runner down -v
          }
          trap cleanup EXIT
          export XBOW_STRIX_BROKER_HMAC_KEY="ci-broker-proof-key"
          export XBOW_STRIX_RUNNER_RPC_HMAC_KEY="ci-runner-proof-key-at-least-32-bytes"
          export XBOW_STRIX_RUNNER_ADMISSION_HMAC_KEY="ci-runner-admission-key-at-least-32-bytes"
          docker compose --profile strix-broker --profile strix-runner up -d \
            --no-deps strix-broker strix-runner
          broker_ready=0
          for _ in $(seq 1 30); do
            if docker compose exec -T strix-runner python -c \
              "import urllib.request; urllib.request.urlopen('http://strix-broker:8090/healthz', timeout=2).read()"; then
              broker_ready=1
              break
            fi
            sleep 1
          done
          if [ "$broker_ready" -ne 1 ]; then
            docker compose --profile strix-broker --profile strix-runner ps
            docker compose --profile strix-broker --profile strix-runner logs --no-color
            exit 1
          fi
          runner_ready=0
          for _ in $(seq 1 30); do
            if docker compose exec -T strix-broker python -c \
              "import urllib.request; urllib.request.urlopen('http://strix-runner:8092/readyz', timeout=2).read()"; then
              runner_ready=1
              break
            fi
            sleep 1
          done
          if [ "$runner_ready" -ne 1 ]; then
            docker compose --profile strix-broker --profile strix-runner ps
            docker compose --profile strix-broker --profile strix-runner logs --no-color
            exit 1
          fi
          if docker compose exec -T strix-runner python -c \
            "import socket; socket.create_connection(('192.0.2.1', 80), timeout=1).close()"; then
            echo "direct public egress unexpectedly succeeded" >&2
            exit 1
          fi
          # Live integration check: the broker may reach runner health, but
          # cannot use session mutation endpoints without runner RPC HMAC.
          # The runner must continue advertising zero executable operations.
          docker compose exec -T strix-broker python - <<'PY'
          import json
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          runner = "http://strix-runner:8092"
          with urlopen(f"{runner}/healthz", timeout=3) as response:
              health = json.load(response)
          assert health["active_execution_enabled"] is False
          assert health["implemented_operations"] == []
          assert health["exec_admission_required"] is True
          assert health["manifest_admission_required"] is True

          with urlopen(f"{runner}/readyz", timeout=3) as response:
              ready = json.load(response)
          assert ready["active_execution_enabled"] is False
          assert ready["implemented_operations"] == []
          assert ready["exec_admission_configured"] is True
          assert ready["manifest_admission_configured"] is True
          assert ready["durable_preparation_replay"] is True

          for endpoint in (
              "/v1/session/create",
              "/v1/session/exec",
              "/v1/session/resolve-port",
              "/v1/session/delete",
          ):
              request = Request(
                  f"{runner}{endpoint}",
                  data=b"{}",
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urlopen(request, timeout=3):
                      raise AssertionError(f"unauthorized session endpoint accepted: {endpoint}")
              except HTTPError as exc:
                  if exc.code != 401:
                      raise AssertionError(
                          f"session endpoint must require authentication: {endpoint}: {exc.code}"
                      ) from exc
          print("Runner live fail-closed readiness and unauthenticated RPC verified")
          PY
          # Exercise signed inert lifecycle against the actual runner over the
          # isolated broker network. No manifest bytes or processes are created.
          docker compose exec -T strix-broker python - <<'PY'
          import hashlib
          import json
          import os
          import secrets
          import time
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          from app.strix_runner_manifest_ticket import build_strix_runner_manifest_ticket
          from app.strix_runner_rpc import RUNNER_RPC_PROTOCOL, sign_runner_rpc_request

          runner = "http://strix-runner:8092"
          rpc_secret = "ci-runner-proof-key-at-least-32-bytes"
          signing_key = os.environ["XBOW_STRIX_RUNNER_ADMISSION_HMAC_KEY"]
          image = "ghcr.io/example/test-sandbox@sha256:" + "a" * 64
          plan = {
              "schema": "strix-manifest-admission-v1",
              "manifest_version": 1,
              "root": "/workspace",
              "entries": [],
              "environment": [],
              "host_paths_included": False,
              "raw_file_content_included": False,
              "filesystem_io_performed": False,
              "manifest_materialized": False,
              "upload_enabled": False,
          }
          plan_json = json.dumps(
              plan, sort_keys=True, separators=(",", ":"), ensure_ascii=False
          )
          plan_digest = hashlib.sha256(plan_json.encode("utf-8")).hexdigest()
          descriptor = {
              "schema": "strix-manifest-admission-v1",
              "contract_hash": "c" * 64,
              "request_id": "ci-inert-prepare-1",
              "image": image,
              "exposed_ports": [],
              "manifest_digest": plan_digest,
              "entry_count": 0,
              "inline_file_count": 0,
              "local_dir_count": 0,
              "inline_file_bytes": 0,
              "environment_value_bytes": 0,
              "host_paths_included": False,
              "raw_file_content_included": False,
              "filesystem_io_performed": False,
              "manifest_materialized": False,
              "upload_enabled": False,
              "active_execution_enabled": False,
          }
          ticket = build_strix_runner_manifest_ticket(
              descriptor, signing_secret=signing_key
          ).to_dict()

          def invoke(path, payload):
              raw = json.dumps(
                  payload, sort_keys=True, separators=(",", ":")
              ).encode("utf-8")
              timestamp = int(time.time())
              nonce = secrets.token_hex(16)
              signature = sign_runner_rpc_request(
                  method="POST",
                  path=path,
                  body=raw,
                  timestamp=timestamp,
                  nonce=nonce,
                  secret=rpc_secret,
              )
              request = Request(
                  runner + path,
                  data=raw,
                  headers={
                      "Content-Type": "application/json",
                      "X-Xbow-Runner-Timestamp": str(timestamp),
                      "X-Xbow-Runner-Nonce": nonce,
                      "X-Xbow-Runner-Signature": signature,
                  },
                  method="POST",
              )
              try:
                  with urlopen(request, timeout=4) as response:
                      return response.status, json.load(response)
              except HTTPError as exc:
                  return exc.code, json.load(exc)

          prepare = {
              "schema": RUNNER_RPC_PROTOCOL,
              "request_id": descriptor["request_id"],
              "image": image,
              "exposed_ports": [],
              "manifest_digest": descriptor["manifest_digest"],
              "admission": ticket,
          }
          path = "/v1/session/prepare"
          status, prepared = invoke(path, prepare)
          assert status == 201, (status, prepared)
          assert prepared["session_id"].startswith("prepared-")
          assert prepared["manifest_materialized"] is False
          assert prepared["active_execution_enabled"] is False
          assert prepared["expires_in_seconds"] == 900
          receipt_path = "/v1/session/plan-receipt"
          receipt = {
              "schema": RUNNER_RPC_PROTOCOL,
              "request_id": "ci-inert-plan-receipt-1",
              "session_id": prepared["session_id"],
              "contract_hash": descriptor["contract_hash"],
              "manifest_digest": plan_digest,
              "plan_json": plan_json,
          }
          status, verified = invoke(receipt_path, receipt)
          assert status == 200, (status, verified)
          assert verified["status"] == "plan_verified"
          assert verified["plan_bytes_verified"] == len(plan_json.encode("utf-8"))
          assert verified["file_contents_received"] is False
          assert verified["manifest_materialized"] is False
          assert verified["active_execution_enabled"] is False
          status, repeated_plan = invoke(receipt_path, receipt)
          assert status == 409, (status, repeated_plan)
          assert repeated_plan["error"] == "manifest_plan_already_verified"
          status, bad_digest = invoke(
              receipt_path, dict(receipt, manifest_digest="f" * 64)
          )
          assert status == 403, (status, bad_digest)
          status, wrong_contract = invoke(
              receipt_path, dict(receipt, contract_hash="d" * 64)
          )
          assert status == 403, (status, wrong_contract)
          status, missing_session = invoke(
              receipt_path, dict(receipt, session_id="prepared-missing")
          )
          assert status == 404, (status, missing_session)

          # A signed digest of unsafe canonical metadata does not authorize it.
          bad_plan = dict(plan, host_paths_included=True)
          bad_json = json.dumps(
              bad_plan, sort_keys=True, separators=(",", ":"), ensure_ascii=False
          )
          bad_sha = hashlib.sha256(bad_json.encode("utf-8")).hexdigest()
          bad_descriptor = dict(
              descriptor, request_id="ci-inert-malformed-plan",
              manifest_digest=bad_sha,
          )
          bad_ticket = build_strix_runner_manifest_ticket(
              bad_descriptor, signing_secret=signing_key
          ).to_dict()
          bad_prepare = dict(
              prepare, request_id=bad_descriptor["request_id"],
              manifest_digest=bad_sha, admission=bad_ticket,
          )
          status, another = invoke(path, bad_prepare)
          assert status == 201, (status, another)
          bad_receipt = dict(
              receipt, request_id="ci-inert-malformed-receipt",
              session_id=another["session_id"], manifest_digest=bad_sha,
              plan_json=bad_json,
          )
          status, malformed = invoke(receipt_path, bad_receipt)
          assert status == 400, (status, malformed)
          assert malformed["error"] == "manifest_plan_rejected"

          # Prove signed expiration and future-date rejection against the actual runner.
          expired_descriptor = dict(descriptor, request_id="ci-inert-expired")
          expired_ticket = build_strix_runner_manifest_ticket(
              expired_descriptor, signing_secret=signing_key,
              now=int(time.time()) - 180,
          ).to_dict()
          expired_prepare = dict(
              prepare, request_id=expired_descriptor["request_id"],
              admission=expired_ticket,
          )
          status, expired = invoke(path, expired_prepare)
          assert status == 403, (status, expired)
          assert expired["error"] == "manifest_admission_rejected"

          future_descriptor = dict(descriptor, request_id="ci-inert-future")
          future_ticket = build_strix_runner_manifest_ticket(
              future_descriptor, signing_secret=signing_key,
              now=int(time.time()) + 60,
          ).to_dict()
          future_prepare = dict(
              prepare, request_id=future_descriptor["request_id"],
              admission=future_ticket,
          )
          status, future = invoke(path, future_prepare)
          assert status == 403, (status, future)
          assert future["error"] == "manifest_admission_rejected"

          status, repeated = invoke(path, prepare)
          assert status == 409, (status, repeated)
          assert repeated["error"] == "preparation_ticket_replayed"

          tampered = dict(prepare)
          tampered["manifest_digest"] = "f" * 64
          status, rejected = invoke(path, tampered)
          assert status == 403, (status, rejected)

          release = {
              "schema": RUNNER_RPC_PROTOCOL,
              "request_id": "ci-inert-release-1",
              "session_id": prepared["session_id"],
              "contract_hash": descriptor["contract_hash"],
          }
          wrong_contract = dict(release, contract_hash="d" * 64)
          status, denied = invoke("/v1/session/release", wrong_contract)
          assert status == 403, (status, denied)
          status, closed = invoke("/v1/session/release", release)
          assert status == 200, (status, closed)
          assert closed["active_execution_enabled"] is False
          status, missing = invoke("/v1/session/release", release)
          assert status == 404, (status, missing)

          # The legacy active lifecycle must remain unavailable even to a
          # caller with valid authentication and a signed manifest ticket.
          status, blocked = invoke("/v1/session/create", prepare)
          assert status == 503, (status, blocked)
          print("Signed inert runner prepare/release lifecycle verified")
          PY
          # Restart the real runner and prove that a fresh signature cannot
          # reuse the already-consumed contract/request identity. The broker
          # and its signing keys are not restarted.
          docker compose --profile strix-runner restart strix-runner
          runner_ready=0
          for _ in $(seq 1 30); do
            if docker compose exec -T strix-broker python -c \
              "import urllib.request; urllib.request.urlopen('http://strix-runner:8092/readyz', timeout=2).read()"; then
              runner_ready=1
              break
            fi
            sleep 1
          done
          if [ "$runner_ready" -ne 1 ]; then
            docker compose --profile strix-runner logs --no-color strix-runner
            exit 1
          fi
          docker compose exec -T strix-broker python - <<'PY'
          import json
          import os
          import secrets
          import time
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          from app.strix_runner_manifest_ticket import build_strix_runner_manifest_ticket
          from app.strix_runner_rpc import RUNNER_RPC_PROTOCOL, sign_runner_rpc_request

          descriptor = {
              "schema": "strix-manifest-admission-v1",
              "contract_hash": "c" * 64,
              "request_id": "ci-inert-prepare-1",
              "image": "ghcr.io/example/test-sandbox@sha256:" + "a" * 64,
              "exposed_ports": [],
              "manifest_digest": "b" * 64,
              "entry_count": 0,
              "inline_file_count": 0,
              "local_dir_count": 0,
              "inline_file_bytes": 0,
              "environment_value_bytes": 0,
              "host_paths_included": False,
              "raw_file_content_included": False,
              "filesystem_io_performed": False,
              "manifest_materialized": False,
              "upload_enabled": False,
              "active_execution_enabled": False,
          }
          ticket = build_strix_runner_manifest_ticket(
              descriptor,
              signing_secret=os.environ["XBOW_STRIX_RUNNER_ADMISSION_HMAC_KEY"],
          )
          payload = {
              "schema": RUNNER_RPC_PROTOCOL,
              "request_id": descriptor["request_id"],
              "image": descriptor["image"],
              "exposed_ports": [],
              "manifest_digest": descriptor["manifest_digest"],
              "admission": ticket.to_dict(),
          }
          body = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          nonce = secrets.token_hex(16)
          timestamp = int(time.time())
          signature = sign_runner_rpc_request(
              method="POST", path="/v1/session/prepare",
              body=body, secret="ci-runner-proof-key-at-least-32-bytes",
              nonce=nonce, timestamp=timestamp,
          )
          request = Request(
              "http://strix-runner:8092/v1/session/prepare",
              data=body, method="POST",
              headers={
                  "Content-Type": "application/json",
                  "X-Xbow-Runner-Timestamp": str(timestamp),
                  "X-Xbow-Runner-Nonce": nonce,
                  "X-Xbow-Runner-Signature": signature,
              },
          )
          try:
              with urlopen(request, timeout=4) as response:
                  raise AssertionError(
                      f"replayed ticket accepted after restart: {response.status}"
                  )
          except HTTPError as exc:
              result = json.load(exc)
              assert exc.code == 409, (exc.code, result)
              assert result["error"] == "preparation_ticket_replayed"
          print("Durable replay rejection across real runner restart verified")
          PY

  strix-python-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned Strix Python runtime
        run: |
          docker build --pull \
            --file backend/Dockerfile.strix-python-runtime \
            --tag xbow-strix-python-runtime:ci \
            backend
      - name: Verify inert runtime in locked-down container
        shell: bash
        run: |
          set -euo pipefail
          for probe in app.strix_backend_hook app.strix_python_compat_probe app.strix_python_bootstrap_runtime; do
            docker run --rm \
              --network none \
              --read-only \
              --tmpfs /tmp:size=16m,noexec,nosuid,nodev \
              --cap-drop ALL \
              --pids-limit 128 \
              --security-opt no-new-privileges:true \
              xbow-strix-python-runtime:ci \
              /opt/strix-python/.venv/bin/python -m "$probe" --self-test
          done
      - name: Import real pinned Strix Python interface without execution
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:size=16m,noexec,nosuid,nodev \
            --cap-drop ALL \
            --pids-limit 128 \
            --security-opt no-new-privileges:true \
            xbow-strix-python-runtime:ci \
            /opt/strix-python/.venv/bin/python \
            -m app.strix_python_bootstrap_runtime --verify-upstream-import
