name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: xbow
          POSTGRES_USER: xbow
          POSTGRES_PASSWORD: xbow-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xbow -d xbow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q backend/app backend/tests
      - run: ruff check backend/app backend/tests
      - name: Verify pinned Strix backend hook
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          wheel="$tmp/strix_agent-1.6.2-py3-none-manylinux_2_17_x86_64.whl"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/usestrix/strix/releases/download/v1.6.2/strix_agent-1.6.2-py3-none-manylinux_2_17_x86_64.whl" \
            -o "$wheel"
          printf '%s  %s\n' \
            "1a93fbf0f18fad6bf4802c41fa5e032ce50880a655fddee47f6bec4f1ea2155b" \
            "$wheel" | sha256sum -c -
          python -m pip install --no-deps --target "$tmp/site" "$wheel"
          PYTHONPATH="$PWD/backend:$tmp/site" \
            python -m app.strix_backend_hook --self-test
          PYTHONPATH="$PWD/backend:$tmp/site" \
            python -m app.strix_python_compat_probe --self-test
          source_base="https://raw.githubusercontent.com/usestrix/strix/ff5c8cc8e46d8e60c2bc2439f7bcb07c05ca3db2"
          pyproject="$tmp/pyproject.toml"
          lockfile="$tmp/uv.lock"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$source_base/pyproject.toml" -o "$pyproject"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$source_base/uv.lock" -o "$lockfile"
          PYTHONPATH="$PWD/backend" \
            python -m app.strix_python_lock_probe \
              --self-test \
              --pyproject "$pyproject" \
              --lock "$lockfile"
      - run: |
          PYTHONPATH=backend \
          XBOW_REDIS_URL=redis://localhost:6379/15 \
          XBOW_TEST_POSTGRES_URL=postgresql://xbow:xbow-ci@localhost:5432/xbow \
          pytest -q --strict-config --strict-markers backend/tests
      - run: |
          PYTHONPATH=backend \
          XBOW_DB_PATH=/tmp/xbow-ci.sqlite3 \
          XBOW_ARTIFACT_ROOT=/tmp/xbow-ci-artifacts \
          python -m app.readiness
      - run: pip-audit -r backend/requirements.txt

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --check frontend/simple.js
      - run: node --check frontend/sw.js
      - run: bash -n scripts/mobile-production-preflight.sh
      - run: bash -n scripts/mobile-production-cutover.sh
      - run: bash -n scripts/mobile-production-rollback.sh
      - run: bash -n scripts/mobile-production-update.sh
      - run: bash -n scripts/mobile-production-status.sh
      - run: bash -n scripts/mobile-enable-hackerone-nuclei.sh
      - run: bash -n scripts/mobile-disable-hackerone-nuclei.sh
      - run: bash -n scripts/mobile-vault-cutover.sh
      - run: bash -n scripts/mobile-vault-rollback.sh
      - run: docker compose config --quiet
      - run: |
          XBOW_POSTGRES_PASSWORD=ci-postgres \
          XBOW_DATABASE_URL=postgresql://xbow:ci-postgres@postgres:5432/xbow \
          XBOW_REDIS_PASSWORD=ci-redis \
          XBOW_REDIS_URL=redis://:ci-redis@redis:6379/0 \
          docker compose -f docker-compose.yml -f docker-compose.distributed.yml config --quiet
      - run: |
          XBOW_PUBLIC_HOST=example.test \
          docker compose -f docker-compose.yml -f docker-compose.tls.yml config --quiet
      - run: |
          docker run --rm \
            -e XBOW_PUBLIC_HOST=example.test \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile
      - run: docker compose build --pull
      - name: Smoke-test hardened frontend
        shell: bash
        run: |
          set -euo pipefail
          export XBOW_API_TOKEN="$(printf 'ci-smoke-%s' "$GITHUB_RUN_ID" | sha256sum | cut -d' ' -f1)"
          docker compose up -d backend frontend
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            docker compose ps
            docker compose logs --no-color backend frontend
            exit 1
          fi
          docker compose ps
          curl -fsSI http://127.0.0.1:8080/
          curl -fsSI http://127.0.0.1:8080/app.css
          curl -fsSI http://127.0.0.1:8080/simple.js
          curl -fsS http://127.0.0.1:8080/ | grep -q 'class="app-shell simple-shell"'
          docker compose down -v
      - run: docker compose --profile scanner build --pull scanner-worker
      - run: docker compose --profile strix-broker build --pull strix-broker strix-egress
      - run: docker compose --profile strix-runner build --pull strix-runner
      - name: strix-runner-network-proof
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker compose --profile strix-broker --profile strix-runner down -v
          }
          trap cleanup EXIT
          export XBOW_STRIX_BROKER_HMAC_KEY="ci-broker-proof-key"
          export XBOW_STRIX_RUNNER_RPC_HMAC_KEY="ci-runner-proof-key-at-least-32-bytes"
          docker compose --profile strix-broker --profile strix-runner up -d \
            --no-deps strix-broker strix-runner
          broker_ready=0
          for _ in $(seq 1 30); do
            if docker compose exec -T strix-runner python -c \
              "import urllib.request; urllib.request.urlopen('http://strix-broker:8090/healthz', timeout=2).read()"; then
              broker_ready=1
              break
            fi
            sleep 1
          done
          if [ "$broker_ready" -ne 1 ]; then
            docker compose --profile strix-broker --profile strix-runner ps
            docker compose --profile strix-broker --profile strix-runner logs --no-color
            exit 1
          fi
          runner_ready=0
          for _ in $(seq 1 30); do
            if docker compose exec -T strix-broker python -c \
              "import urllib.request; urllib.request.urlopen('http://strix-runner:8092/readyz', timeout=2).read()"; then
              runner_ready=1
              break
            fi
            sleep 1
          done
          if [ "$runner_ready" -ne 1 ]; then
            docker compose --profile strix-broker --profile strix-runner ps
            docker compose --profile strix-broker --profile strix-runner logs --no-color
            exit 1
          fi
          if docker compose exec -T strix-runner python -c \
            "import socket; socket.create_connection(('192.0.2.1', 80), timeout=1).close()"; then
            echo "direct public egress unexpectedly succeeded" >&2
            exit 1
          fi
