name: Align Task4 Fixtures

on:
  push:
    branches:
      - governance/pr151-selective-migration
    paths:
      - .github/workflows/align-task4-fixtures.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/pr151-selective-migration
          fetch-depth: 0

      - name: Align evidence-backed validation fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          path = Path("backend/tests/test_observation_graph.py")
          text = path.read_text()
          text = replace_once(
              text,
              '    graph.add(Observation("v1", "validation", "observed", "validator", parent_ids=("f1",)))\n    assert AdaptivePlanner().plan(active_campaign, graph)[0].kind == "stop"\n',
              '    graph.add(Observation("v1", "validation", "observed", "validator", parent_ids=("f1",)))\n    graph.add(Observation("ve1", "evidence", "validation-artifact", "validator", parent_ids=("v1",)))\n    assert AdaptivePlanner().plan(active_campaign, graph)[0].kind == "stop"\n',
              "bounded phases evidence",
          )
          text = replace_once(
              text,
              '    graph.add(Observation("v1", "validation", "observed", "validator", parent_ids=("f1",)))\n\n    action = AdaptivePlanner().plan(campaign(findings=(finding(),)), graph)[0]\n',
              '    graph.add(Observation("v1", "validation", "observed", "validator", parent_ids=("f1",)))\n    graph.add(Observation("ve1", "evidence", "validation-artifact", "validator", parent_ids=("v1",)))\n\n    action = AdaptivePlanner().plan(campaign(findings=(finding(),)), graph)[0]\n',
              "resolution evidence",
          )
          text = replace_once(
              text,
              '    graph.add(Observation("v1", "validation", "observed", "validator", parent_ids=("f1",)))\n\n    action = AdaptivePlanner().plan(campaign(findings=(finding(status="rejected"),)), graph)[0]\n',
              '    graph.add(Observation("v1", "validation", "observed", "validator", parent_ids=("f1",)))\n    graph.add(Observation("ve1", "evidence", "validation-artifact", "validator", parent_ids=("v1",)))\n\n    action = AdaptivePlanner().plan(campaign(findings=(finding(status="rejected"),)), graph)[0]\n',
              "rejected evidence",
          )
          path.write_text(text)

          path = Path("backend/tests/test_orchestrator.py")
          text = path.read_text()
          old = '''    store.put_observation(\n        campaign.id,\n        Observation("v2", "validation", "observed", "validator", parent_ids=("finding:f2",)).to_dict(),\n    )\n    waiting = advance_campaign(campaign, queue, store)\n'''
          new = '''    store.put_observation(\n        campaign.id,\n        Observation("v2", "validation", "observed", "validator", parent_ids=("finding:f2",)).to_dict(),\n    )\n    store.put_observation(\n        campaign.id,\n        Observation("ev1", "evidence", "validation-artifact", "validator", parent_ids=("v1",)).to_dict(),\n    )\n    store.put_observation(\n        campaign.id,\n        Observation("ev2", "evidence", "validation-artifact", "validator", parent_ids=("v2",)).to_dict(),\n    )\n    waiting = advance_campaign(campaign, queue, store)\n'''
          text = replace_once(text, old, new, "orchestrator evidence fixtures")
          path.write_text(text)
          PY

      - name: Run focused regression tests
        run: |
          python -m pip install -q -r backend/requirements-dev.txt
          PYTHONPATH=backend pytest -q backend/tests/test_evidence_backed_planner.py backend/tests/test_observation_graph.py backend/tests/test_orchestrator.py

      - name: Commit fixture alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_observation_graph.py backend/tests/test_orchestrator.py
          git commit -m "test: align planner fixtures with evidence-backed validation"
          git push origin HEAD:governance/pr151-selective-migration
